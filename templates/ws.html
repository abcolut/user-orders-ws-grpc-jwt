<script>
    var ar = [];
    var userId

    let ws

    // function initWsOld() {

    //     ws.onopen = () => { addMessageToArchive('✅ WS: соединение установлено'); }

    //     ws.onclose = () => { addMessageToArchive('🔌 WS: соединение закрыто'); }
    // }


    function createReconnectingSocket(url, onMessage, onOpen) {
        let retryCount = 0;
        const maxRetries = 20;

        function connect() {
            const ws = new WebSocket(url);

            ws.onopen = () => {
                retryCount = 0;
                if (onOpen) onOpen(ws);
            };

            ws.onmessage = (event) => onMessage(event);

            ws.onclose = (event) => {
                if (event.code === 1000) return; // нормальное закрытие — не надо переподключаться

                retryCount++;
                if (retryCount > maxRetries) {
                    console.warn('Слишком много попыток переподключения, сдаёмся');
                    return;
                }
                const delay = Math.min(1000 * Math.pow(2, retryCount - 1), 30000);
                console.log(`Соединение потеряно, пробуем через ${delay / 1000} сек…`);
                setTimeout(connect, delay);
            };

            ws.onerror = (err) => console.error('WS error', err);
        }
        connect();
    }


    function addMessageToArchive(data) {
        ar.push(data);
        // console.log(data);
        s = ar.join("<br>")
        divMessages = document.getElementById("divMessages")
        if (divMessages) { divMessages.innerHTML = s }
    }


    function onMessage(event) {
        // console.log("onMessage", event.data)
        addMessageToArchive(event.data)
    }

    function onOpen() {
        addMessageToArchive("WS chanel open!!!")
    }

    // var user_id

    document.addEventListener('DOMContentLoaded', () => {
        divMessages = document.getElementById("divMessages")
        userId = getUserId()
        console.log("userId", userId)
        if (divMessages) { divMessages.innerHTML = "User ID:" + userId }
        createReconnectingSocket('ws://localhost:8080/api/ws?user_id=' + userId, onMessage, onOpen)
    });


    function parseJwt(token) {
        try {
            const payloadB64 = token.split('.')[1];
            const payloadJson = atob(payloadB64.replace(/-/g, '+').replace(/_/g, '/'));
            return JSON.parse(payloadJson);
        } catch (e) {
            return null;
        }
    }

    function getUserId() {
        const token = localStorage.getItem('jwt_token');
        console.log("token", token)
        if (!token) return null;

        const payload = parseJwt(token);
        console.log(payload)
        return payload?.sub || payload?.user_id || null;
    }


</script>
