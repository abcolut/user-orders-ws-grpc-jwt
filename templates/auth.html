
<h3 align="center">PET get/ post/ token/ validation/ env</h3>

<div class="row">
    Пример работы с post, get роутами. Получение jwt token. Работа с файлами (вывод на экран заранее подготовленного
    html файла). Работа с валидаторами, ошибками сервера.
</div>

<div>
    <div class="row" id="tokenName">
        <label>Имя: </label><input name="name" placeholder="name" value="Name">
    </div>
    <div class="row" id="tokenEmail">
        <label>Емайл: </label><input name="email" placeholder="email" value="email@email.email">
    </div>
    <div class="row" id="tokenPassword">
        <label>Пароль: </label><input name="password" placeholder="password" value="Password12345" type="password">
    </div>
</div>
<div>
    <div class="row"><button onclick="authUser()">Войти и получить токен</button></div>
    <div id="answer" class="row center goodAnswer"></div>
    <div id="error" class="row center errorAnswer"></div>
    <div id="status" class="row center"></div>
    <div id="token" class="row center grey"></div>

    <div class="row"><button onclick="reciveSecretPost()">Защищенный рессурс</button></div>
    <div id="answer2" class="row center goodAnswer"></div>
    <div id="error2" class="row center errorAnswer"></div>
    <div class="row"><button onclick="resetToken()">Обнулить token</button></div>

    <div id="user_id" class="row center grey"></div>
</div>



<script>
    let token
    let divAnswer
    let divError
    let divResponceStatus
    let divToken

    let divAnswer2
    let divError2

    function authUser() {
        if (divAnswer) { divAnswer.innerHTML = "" }
        if (divToken) { divToken.innerHTML = "" }
        if (divAnswer2) { divAnswer2.innerHTML = "" }
        if (divError) { divError.innerHTML = "" }
        if (divError2) { divError2.innerHTML = "" }

        const formData = {
            username: document.querySelector('input[name="name"]').value,
            email: document.querySelector('input[name="email"]').value,
            password: document.querySelector('input[name="password"]').value
        };

        fetch('/api/auth', {
            method: 'POST', headers: { 'Content-Type': 'application/json', }, body: JSON.stringify(formData),
        })
            .then((res) => {

                if (divResponceStatus) { divResponceStatus.innerHTML = res.status }
                // if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json(); // сам распарсит JSON
            })
            .then((data) => {
                if (data.data) {
                    if (divAnswer) { divAnswer.innerHTML = JSON.stringify(data.data) }
                    if (data.data.access_token) {
                        token = data.data.access_token
                        localStorage.setItem('jwt_token', token);
                        if (divToken) { divToken.innerHTML = "" + token }
                    }
                }
                if (divError && data.error) { divError.innerHTML = JSON.stringify(data.error) }
            })
            .catch((err) => {
                console.error('Запрос не выполнен:', err);
                divAnswer.innerHTML = err
            });
    }



    function reciveSecretPost() {
        // if (divAnswer) { divAnswer.innerHTML = "" }
        // if (divToken) { divToken.innerHTML = "" }
        // if (divAnswer2) { divAnswer2.innerHTML = "" }
        // if (divError) { divError.innerHTML = "" }
        // if (divError2) { divError2.innerHTML = "" }

        // const formData = {
        //     username: document.querySelector('input[name="name"]').value,
        //     email: document.querySelector('input[name="email"]').value,
        //     password: document.querySelector('input[name="password"]').value
        // };

        fetch('/secret', {
            method: 'POST',
            // headers: { 'Content-Type': 'application/json', }, body: JSON.stringify(formData),
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        })
            .then((res) => {

                if (divResponceStatus) { divResponceStatus.innerHTML = res.status }
                // if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json(); // сам распарсит JSON
            })
            .then((data) => {
                if (data.data) {
                    if (divAnswer2) { divAnswer2.innerHTML = JSON.stringify(data.data) }

                }
                if (divError2 && data.error) { divError2.innerHTML = JSON.stringify(data.error) }
            })
            .catch((err) => {
                console.error('Запрос не выполнен:', err);
                divAnswer2.innerHTML = err
            });
    }


    function resetToken() {
        token = ""
        localStorage.setItem('jwt_token', "");
        if (divAnswer) { divAnswer.innerHTML = "" }
        if (divToken) { divToken.innerHTML = "" }
        if (divResponceStatus) { divResponceStatus.innerHTML = "" }
        if (divAnswer2) { divAnswer2.innerHTML = "" }
        if (divError) { divError.innerHTML = "" }
        if (divError2) { divError2.innerHTML = "" }
    }

    document.addEventListener('DOMContentLoaded', () => {
        divAnswer = document.getElementById("answer")
        divError = document.getElementById("error")
        divToken = document.getElementById("token")
        divResponceStatus = document.getElementById("status")
        divAnswer2 = document.getElementById("answer2")
        divError2 = document.getElementById("error2")

        token = localStorage.getItem('jwt_token');
        if (divToken) { divToken.innerHTML = token }

        divUserId = document.getElementById("user_id")
        divUserId.innerHTML = "user_id:" + getUserId() + " auth status:" + isAuthorized()
    });


    function parseJwt(token) {
        try {
            const payloadB64 = token.split('.')[1];
            const payloadJson = atob(payloadB64.replace(/-/g, '+').replace(/_/g, '/'));
            return JSON.parse(payloadJson);
        } catch (e) {
            return null;
        }
    }

    function getUserId() {
        const token = localStorage.getItem('jwt_token');
        if (!token) return null;

        const payload = parseJwt(token);
        // Обычно в payload кладут sub или user_id
        return payload?.sub || payload?.user_id || null;
    }

    function isAuthorized() {
        const token = localStorage.getItem('jwt_token');
        if (!token) return false;

        const payload = parseJwt(token);
        if (!payload) return false; // невалидный формат

        const now = Math.floor(Date.now() / 1000);
        return !payload.exp || payload.exp > now; // если exp нет или он в будущем — считаем ок
    }




</script>
